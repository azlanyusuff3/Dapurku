<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5568e8" />
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('dapurkuTheme')||'light'}catch(e){}})();</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DapurKu" />
  <title>DapurKu</title>
  <link rel="manifest" href="manifest.webmanifest?v=3.3" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=3.3" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><div class="brand-mark">D</div><div><h1>DapurKu</h1><span>pantry • shop • cook</span></div></div>
      <div class="top-actions"><button id="themeBtn" class="icon-btn" title="Switch theme">☾</button><button id="installBtn" class="install-btn hidden" title="Install DapurKu">Install</button></div>
    </header>
    <main id="appMain">
      <section id="view-home" class="view active"></section>
      <section id="view-shop" class="view"></section>
      <section id="view-pantry" class="view"></section>
      <section id="view-recipes" class="view"></section>
      <section id="view-more" class="view"></section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-view="shop" class="nav-btn"><span>🛒</span><small>Shop</small></button>
      <button data-view="pantry" class="nav-btn"><span>▦</span><small>Pantry</small></button>
      <button data-view="recipes" class="nav-btn"><span>🍳</span><small>Cook</small></button>
      <button data-view="more" class="nav-btn"><span>•••</span><small>More</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div><div id="modalRoot"></div>
  <script src="config.js?v=3.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=3.3"></script>
</body>
</html>
